    function shiftLabelFor(from){const h=apptMinutes(from)/60;return h<12?"Morning":h<16?"Midshift":"Closing";}
    function weekDates(startKey){return Array.from({length:7},(_,i)=>shiftDate(startKey,i));}
    function scheduleTotalMinutes(sched){if(!sched||!sched.days)return 0;return weekDates(sched.weekStart).reduce((sum,d)=>{const day=sched.days[d];return sum+(day?apptMinutes(day.to)-apptMinutes(day.from):0);},0);}
    function buildScheduleBody(sched){
      const dates=weekDates(sched.weekStart);
      const lines=dates.map(d=>{const day=sched.days[d];return `${dateLabel(d,{weekday:"short",month:"short",day:"numeric"})}: ${day?`${timeLabel(day.from)} – ${timeLabel(day.to)} · ${shiftLabelFor(day.from)}`:"Off"}`;});
      return `Weekly schedule ${dateLabel(sched.weekStart,{month:"short",day:"numeric"})} – ${dateLabel(dates[6],{month:"short",day:"numeric",year:"numeric"})}\n${lines.join("\n")}\nTotal: ${durationLabel(scheduleTotalMinutes(sched))}`;
    }
    function weeklyScheduleSection(){
      const sched=db.settings.weeklySchedule,doctor=hasRole("Doctor"),startKey=weekStart(todayKey()),dates=weekDates(startKey);
      const active=Boolean(sched&&sched.weekStart===startKey&&sched.days),stale=Boolean(sched&&sched.weekStart!==startKey);
      const total=active?scheduleTotalMinutes(sched):0;
      const head=`<h2>Weekly schedule</h2><p>${active?"Published for this week. The staff chat holds this week's copy.":stale?`No schedule published for this week yet. The last one covered the week of ${dateLabel(sched.weekStart)}.`:"No schedule published for this week yet."}</p>`;
      const hours=`<div class="metric-line"><span>Planned hours this week</span><strong>${active?durationLabel(total):"—"}</strong></div>`;
      if(!doctor){
        const list=active?dates.map(d=>{const day=sched.days[d];return `<div class="metric-line"><span>${dateLabel(d,{weekday:"short",month:"short",day:"numeric"})}</span><strong>${day?`${timeLabel(day.from)} – ${timeLabel(day.to)} · ${shiftLabelFor(day.from)}`:"Off"}</strong></div>`;}).join(""):`<div class="empty-state">The clinic doctor publishes the weekly schedule.</div>`;
        return `<section class="card settings-section">${head}${hours}${list}</section>`;
      }
      const rows=dates.map((d,i)=>{
        const day=active?sched.days[d]:null,work=active?Boolean(day):(i<5);
        const from=day?day.from:"09:00",to=day?day.to:"17:00";
        return `<div class="sched-day"><label class="check-row"><input type="checkbox" name="d${i}work" ${work?"checked":""}><strong>${dateLabel(d,{weekday:"short",month:"short",day:"numeric"})}</strong></label><input type="time" name="d${i}from" step="1800" value="${from}"${work?"":" disabled"}><input type="time" name="d${i}to" step="1800" value="${to}"${work?"":" disabled"}><span class="sched-shift" data-shift-for="${i}">${shiftLabelFor(from)}</span></div>`;
      }).join("");
      return `<section class="card settings-section">${head}${hours}<form id="scheduleForm">${rows}<div class="field-hint">Shift labels are automatic: Morning starts before 12:00, Midshift 12:00&ndash;15:59, Closing 16:00 or later. Publishing replaces last week's schedule and posts this week's copy to the staff chat.</div><div class="modal-actions"><button class="primary-btn" type="submit">Publish schedule</button></div></form></section>`;
    }

label><input name="newPassword" type="password" minlength="10" autocomplete="new-password" placeholder="Leave blank to keep current password"></div></div><div class="field-hint">Leave both password fields blank to keep your current password. Role and permissions are managed by the clinic doctor.</div><div class="modal-actions"><button class="primary-btn" type="submit">Save profile</button></div></form></section>${weeklyScheduleSection()}</div>`;

    let logsCategory="all",logsActor="all",logsRange="all";
    const LOG_CATEGORIES=[["all","All activity"],["access","Sign-ins"],["appointments","Appointments"],["patients","Patients"],["payments","Payments"],["staff","Staff accounts"],["messages","Templates & email"],["settings","Settings & profile"],["data","Data & backups"]];
    const LOG_TYPE_CATEGORY={"sign-in":"access","sign-out":"access","appointment-created":"appointments","appointment-updated":"appointments","appointment-moved":"appointments","visit-deleted":"appointments","patient-created":"patients","patient-updated":"patients","patient-removed":"patients","payment-recorded":"payments","payment-updated":"payments","payment-deleted":"payments","payment-refunded":"payments","refund-reversed":"payments","staff-created":"staff","staff-updated":"staff","staff-paused":"staff","staff-resumed":"staff","staff-removed":"staff","template-saved":"messages","template-removed":"messages","email-sent":"messages","email-draft":"messages","settings-changed":"settings","profile-updated":"settings","profile-photo-changed":"settings","backup-exported":"data","backup-imported":"data","data-exported":"data","data-imported":"data"};

    function logLabel(entry){

    function renderLogs(){
      const items=db.activity.filter(entry=>{
        if(logsCategory!=="all"&&logCategory(entry)!==logsCategory)return false;
        if(logsActor!=="all"&&entry.actorId!==logsActor)return false;
        if(logsRange==="today"&&String(entry.createdAt||"").slice(0,10)!==todayKey())return false;
        if(logsRange==="week"&&new Date(entry.createdAt||0).getTime()<Date.now()-7*86400000)return false;
        return true;
      }).slice().sort((a,b)=>String(b.createdAt||"").localeCompare(String(a.createdAt||"")));

    function downscaleProfileImage(dataUrl,maxSize=256){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,maxSize/Math.max(img.width,img.height)||1),width=Math.max(1,Math.round(img.width*scale)),height=Math.max(1,Math.round(img.height*scale)),canvas=document.createElement("canvas");canvas.width=width;canvas.height=height;const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,width,height);ctx.drawImage(img,0,0,width,height);try{resolve(canvas.toDataURL("image/jpeg",0.82));}catch(error){reject(error);}};img.onerror=()=>reject(new Error("the image could not be loaded"));img.src=dataUrl;});}

    function exportCsv(kind){
      const patientRows=()=>[["Patient ID","Name","Phone","Email","Date of birth","Last visit","Reference"],...db.patients.map(person=>[person.id,person.name,person.phone,person.email,person.dob,person.lastVisit,person.reference])];

      const appointmentRowsCsv=()=>[["ID","Date","Time","Patient","Type","Status","Reason"],...db.appointments.map(item=>[item.id,item.date,item.time,findPatient(item.patientId)?.name||"",item.type,item.status,item.reason])];
      let rows;
      if(kind==="patients")rows=patientRows();
      else if(kind==="payments")rows=paymentRows();
      else if(kind==="appointments")rows=appointmentRowsCsv();
      else rows=[["Vntera Clinic export",todayKey()],["Patients"],...patientRows(),[],["Appointments"],...appointmentRowsCsv(),[],["Payments"],...paymentRows()];
      downloadFile(`vntera-${kind}-${todayKey()}.csv`,rows.map(row=>row.map(csvCell).join(",")).join("\r\n"),"text/csv;charset=utf-8");

    function parseCsv(text){
      const rows=[];let row=[],cell="",inQuotes=false;
      text=String(text).replace(/^\uFEFF/,"");
      for(let i=0;i<text.length;i++){
        const c=text[i];
        if(inQuotes){
          if(c==='"'){if(text[i+1]==='"'){cell+='"';i++;}else inQuotes=false;}
          else cell+=c;
        }else if(c==='"')inQuotes=true;
        else if(c===","){row.push(cell);cell="";}
        else if(c==="\n"){row.push(cell);rows.push(row);row=[];cell="";}
        else if(c==="\r"){}
        else cell+=c;
      }
      if(cell.length||row.length){row.push(cell);rows.push(row);}
      return rows;
    }
    function findPersonForSheet(value){
      const v=String(value||"").trim();if(!v)return null;
      return db.patients.find(p=>String(p.id).toUpperCase()===v.toUpperCase())||db.patients.find(p=>p.name.toLowerCase()===v.toLowerCase())||null;
    }
    function importPatientRows(rows){
      const out={added:0,updated:0,skipped:0};
      rows.forEach(row=>{
        const [id,name,phone,email,dob,lastVisit,reference]=row.map(v=>String(v||"").trim());
        if(!name&&!id){out.skipped++;return;}
        let person=id?db.patients.find(p=>String(p.id).toUpperCase()===id.toUpperCase()):null;
        if(!person&&name)person=db.patients.find(p=>p.name.toLowerCase()===name.toLowerCase());
        if(person){
          person.name=name||person.name;person.phone=phone||person.phone;person.email=email||person.email;person.dob=dob||person.dob;person.lastVisit=lastVisit||person.lastVisit;person.reference=reference||person.reference;person.updatedAt=new Date().toISOString();out.updated++;
        }else{
          db.patients.push({id:String(id||makeId("pt")).toUpperCase(),name,phone,email,dob,lastVisit,reference,visitCount:0,notes:"",createdAt:new Date().toISOString()});out.added++;
        }
      });
      return out;
    }
    function importAppointmentRows(rows){
      const out={added:0,updated:0,skipped:0};
      rows.forEach(row=>{
        const [id,date,time,patient,type,status,reason]=row.map(v=>String(v||"").trim());
        if(!date||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!time){out.skipped++;return;}
        const person=findPersonForSheet(patient);
        if(!person){out.skipped++;return;}
        const existing=id?db.appointments.find(a=>a.id===id):null;
        if(existing){
          Object.assign(existing,{date,time,patientId:person.id,type:type||existing.type,status:status||existing.status,reason,updatedAt:new Date().toISOString()});out.updated++;return;
        }
        if(db.appointments.some(a=>a.date===date&&a.patientId===person.id&&a.status!=="Cancelled"&&apptMinutes(time)<apptMinutes(a.time)+apptDuration(a)&&apptMinutes(a.time)<apptMinutes(time)+30)){out.skipped++;return;}
        db.appointments.push({id:id||makeId("apt"),patientId:person.id,date,time,type:type||"Consultation",status:["Needs confirmation","Confirmed","Arrived","Completed","Cancelled"].includes(status)?status:"Needs confirmation",reason,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
        out.added++;
      });
      return out;
    }
    function importPaymentRows(rows){
      const out={added:0,updated:0,skipped:0};
      rows.forEach(row=>{
        const [id,date,patient,amount,currency,rate,usdAmount,method]=row.map(v=>String(v||"").trim());
        const value=Number(amount);
        if(!date||!(value>0)){out.skipped++;return;}
        if(id&&db.payments.some(p=>p.id===id)){out.skipped++;return;}
        const person=findPersonForSheet(patient);
        if(!person){out.skipped++;return;}
        const cur=currency==="LBP"?"LBP":"USD",fx=Number(rate)||1;
        db.payments.push({id:id||makeId("pay"),patientId:person.id,amount:value,currency:cur,exchangeRate:cur==="LBP"?fx:1,usdAmount:Number(usdAmount)||(cur==="USD"?value:value/(fx||1)),method:method||"Cash",date,createdAt:new Date().toISOString()});
        out.added++;
      });
      return out;
    }
    async function importSheet(kind,file){
      if(SERVER_MODE){toast("CSV import runs in the local app. The shared clinic records are managed in the clinic spreadsheet.",true);return;}
      let text;try{text=await file.text();}catch{toast("That file could not be read.",true);return;}
      const rows=parseCsv(text);if(!rows.length){toast("That file has no rows to import.",true);return;}
      const sections=[];
      if(kind==="all"){
        let name=null,buf=[];
        const flush=()=>{if(name&&buf.length>1)sections.push([name,buf.slice(1)]);buf=[];};
        rows.forEach(row=>{
          const first=String(row[0]||"").trim().toLowerCase();
          if(row.filter(cell=>String(cell||"").trim()).length===1&&["patients","appointments","payments"].includes(first)){flush();name=first;return;}
          if(name)buf.push(row);
        });
        flush();
        if(!sections.length){toast("No Patients, Appointments or Payments sections were found in that file.",true);return;}
      }else sections.push([kind,rows.slice(1)]);
      const total={added:0,updated:0,skipped:0};
      sections.forEach(([name,sectionRows])=>{
        const result=name==="patients"?importPatientRows(sectionRows):name==="appointments"?importAppointmentRows(sectionRows):importPaymentRows(sectionRows);
        total.added+=result.added;total.updated+=result.updated;total.skipped+=result.skipped;
      });
      if(!total.added&&!total.updated){toast(`Nothing was imported (${total.skipped} rows skipped). Check that the file has the exported columns and matching patient names.`,true);return;}
      recordActivity("data-imported",{kind,note:`${total.added} added, ${total.updated} updated`});

            if(dataUrl.length>46000){toast("That photo is too detailed to keep under the 35 KB save limit. Try a simpler or smaller image.",true);return;}
            await saveProfileImage(dataUrl);
          }catch(error){toast(`That image could not be processed: ${error.message||"try another file"}`,true);}
        };
        reader.onerror=()=>toast("That image could not be read. Try another file.",true);
        reader.readAsDataURL(file);return;
      }
      if(target.id==="calendarMode"){calendarMode=target.value;render();return;}
      if(target.id==="emailTemplate"||target.id==="emailPatient"){updateEmailFields();return;}
      if(target.id==="paymentCurrency"||target.id==="paymentRate"){updatePaymentConversion();return;}
      if(target.id==="collectPayment"){const box=$("#collectFields");if(box)box.hidden=!target.checked;if(target.checked)updateCollectPreview();return;}
      if(target.id==="collectCurrency"){updateCollectPreview();return;}
      if(target.dataset.action==="toggle-section"){db.sections[target.dataset.section]=target.checked;saveDB();render();return;}
      if(target.dataset.action==="toggle-animations"){db.animations=target.checked;saveDB();render();return;}
    }
    function handleInput(event){
      const input=event.target;
      if(input.matches('[data-search="appointments"]')){const pos=input.selectionStart;appointmentSearch=input.value;render();const next=$('[data-search="appointments"]');if(next){next.focus();next.setSelectionRange(pos,pos);}return;}
      if(input.matches('[data-search="patients"]')){const pos=input.selectionStart;patientSearch=input.value;render();const next=$('[data-search="patients"]');if(next){next.focus();next.setSelectionRange(pos,pos);}return;}
      if(input.closest("#appointmentForm")&&(input.name==="payAmount"||input.name==="payRate")){updateCollectPreview();return;}
      if(input.closest("#paymentForm")&&(input.name==="amount"||input.name==="exchangeRate")){updatePaymentConversion();}
    }
    document.addEventListener("click",handleClick);
    document.addEventListener("submit",handleSubmit);
    document.addEventListener("change",handleChange);
    document.addEventListener("input",handleInput);
    document.addEventListener("keydown",event=>{if(event.key==="Escape"){if($("#modalRoot").innerHTML)closeModal();$("#sidebar").classList.remove("open");$("#sidebarScrim").classList.remove("show");}if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==="k"){const search=$(".global-search:not([hidden]) input")||$('[data-search="patients"]')||$('[data-search="appointments"]');if(search){event.preventDefault();search.focus();}}});
    document.addEventListener("dragstart",event=>{
      const grip=event.target instanceof Element?event.target.closest("[data-ov-grip]"):null;
      if(grip&&customizeMode){ovDragId=grip.dataset.ovGrip;try{event.dataTransfer.effectAllowed="move";event.dataTransfer.setData("text/plain",ovDragId);}catch{}return;}
      const chip=event.target instanceof Element?event.target.closest(".calendar-event,.timeline-body[draggable]"):null;
      if(chip&&chip.dataset.id){apptDragId=chip.dataset.id;try{event.dataTransfer.effectAllowed="move";event.dataTransfer.setData("text/plain",apptDragId);}catch{}chip.classList.add("dragging-chip");return;}
    });
    document.addEventListener("dragover",event=>{
      if(ovDragId){const card=event.target instanceof Element?event.target.closest("[data-ov]"):null;if(card){event.preventDefault();document.querySelectorAll(".ov-drag-over").forEach(el=>{if(el!==card)el.classList.remove("ov-drag-over");});card.classList.add("ov-drag-over");}return;}
      if(apptDragId){const zone=event.target instanceof Element?event.target.closest(".calendar-cell,.hour-slot"):null;if(zone){event.preventDefault();document.querySelectorAll(".drop-hint").forEach(el=>{if(el!==zone)el.classList.remove("drop-hint");});zone.classList.add("drop-hint");}}
    });
    document.addEventListener("dragleave",event=>{
      if(ovDragId){const card=event.target instanceof Element?event.target.closest("[data-ov]"):null;if(card&&!card.contains(event.relatedTarget))card.classList.remove("ov-drag-over");}
      if(apptDragId){const zone=event.target instanceof Element?event.target.closest(".calendar-cell,.hour-slot"):null;if(zone&&!zone.contains(event.relatedTarget))zone.classList.remove("drop-hint");}
    });
    document.addEventListener("drop",event=>{
      if(ovDragId){
        const card=event.target instanceof Element?event.target.closest("[data-ov]"):null;
        event.preventDefault();
        document.querySelectorAll(".ov-drag-over").forEach(el=>el.classList.remove("ov-drag-over"));
        const to=card?card.dataset.ov:null;
        if(to&&to!==ovDragId){
          const layout=getOverviewLayout(),fromI=layout.order.indexOf(ovDragId),toI=layout.order.indexOf(to);
          if(fromI>=0&&toI>=0){layout.order.splice(fromI,1);layout.order.splice(toI,0,ovDragId);saveOverviewLayout(layout);render();}
        }
        ovDragId=null;return;
      }
      if(apptDragId){
        const slot=event.target instanceof Element?event.target.closest(".hour-slot"):null,cell=slot?null:(event.target instanceof Element?event.target.closest(".calendar-cell"):null);
        event.preventDefault();
        document.querySelectorAll(".drop-hint,.dragging-chip").forEach(el=>el.classList.remove("drop-hint","dragging-chip"));
        const item=db.appointments.find(a=>a.id===apptDragId);
        const date=slot?slot.dataset.dropDate:(cell?cell.querySelector(".calendar-date")?.dataset.date:null);
        const time=slot?slot.dataset.dropHour:null;
        if(item&&date){
          const nextTime=time||item.time;
          if(item.date===date&&item.time===nextTime){apptDragId=null;return;}
          const collision=findVisitCollision(item.id,date,nextTime,apptDuration(item));
          if(collision)toast(collision.time===nextTime?"That time is already booked. Drop on a free slot or use Move.":`That visit would overlap the ${timeLabel(collision.time)} visit. Drop on a free slot or use Move.`,true);
          else{item.date=date;item.time=nextTime;item.updatedAt=new Date().toISOString();recordActivity("appointment-moved",{patientName:findPatient(item.patientId)?.name||"Patient",date,time:nextTime,note:"drag and drop"});calendarDate=date;saveDB();render();}
        }
        apptDragId=null;return;
      }
    });
    document.addEventListener("dragend",()=>{
      ovDragId=null;apptDragId=null;
      document.querySelectorAll(".ov-drag-over,.drop-hint,.dragging-chip").forEach(el=>el.classList.remove("ov-drag-over","drop-hint","dragging-chip"));
    });
    let ovHeightTap=null;
    document.addEventListener("pointerdown",event=>{
      const handle=event.target instanceof Element?event.target.closest("[data-ov-resize]"):null;
      if(!handle||!customizeMode)return;
      const card=handle.closest("[data-ov]");if(!card||!card.parentElement)return;
      const id=card.dataset.ov,dir=handle.dataset.ovResize;
      if(dir==="h"){const now=Date.now();if(ovHeightTap&&ovHeightTap.id===id&&now-ovHeightTap.time<400){ovHeightTap=null;const layout=getOverviewLayout();if(id in layout.heights){delete layout.heights[id];saveOverviewLayout(layout);render();}return;}ovHeightTap={id,time:now};}
      const grid=card.parentElement,gap=parseFloat(getComputedStyle(grid).columnGap)||15;
      const colW=(grid.clientWidth-11*gap)/12,layout=getOverviewLayout();
      ovResize={id,dir,card,colW,gap,startX:event.clientX,startY:event.clientY,startSpan:ovSpan(id),startH:Number(layout.heights[id])||Math.round(card.getBoundingClientRect().height),newSpan:null,newH:null};
      handle.classList.add("active");card.style.userSelect="none";
      try{event.preventDefault();}catch{}
    });
    document.addEventListener("pointermove",event=>{
      if(!ovResize)return;
      const r=ovResize;
      if(r.dir==="w"){
        const unit=r.colW+r.gap,startW=r.startSpan*unit-r.gap;
        let span=Math.round((startW+(event.clientX-r.startX)+r.gap)/unit);
        const min=OV_MIN_SPAN[r.id]||4;
        span=Math.max(min,Math.min(12,span));
        if(span!==r.newSpan){r.newSpan=span;r.card.style.gridColumn=`span ${span}`;r.card.setAttribute("data-span",String(span));}
      }else{
        const h=Math.max(120,Math.round((r.startH+(event.clientY-r.startY))/8)*8);
        if(h!==r.newH){r.newH=h;r.card.style.minHeight=`${h}px`;}
      }
    });
    const endOvResize=()=>{
      if(!ovResize)return;
      const r=ovResize;ovResize=null;
      document.querySelectorAll(".ov-resize-w.active,.ov-resize-h.active").forEach(el=>el.classList.remove("active"));
      const layout=getOverviewLayout();let changed=false;
      if(r.dir==="w"&&r.newSpan&&r.newSpan!==r.startSpan){layout.spans[r.id]=r.newSpan;changed=true;}
      if(r.dir==="h"&&r.newH&&r.newH!==r.startH){layout.heights[r.id]=r.newH;changed=true;}
      if(changed){saveOverviewLayout(layout);render();}
    };
    document.addEventListener("pointerup",endOvResize);
    document.addEventListener("pointercancel",endOvResize);
    let photoResize=null;
    document.addEventListener("pointerdown",event=>{
      const grip=event.target instanceof Element?event.target.closest("[data-photo-resize]"):null;
      if(!grip)return;
      const banner=grip.closest(".welcome-banner");
      if(!banner)return;
      event.preventDefault();grip.classList.add("dragging");
      photoResize={grip,banner,startX:event.clientX,startY:event.clientY,start:photoSizeValue(),current:photoSizeValue()};
      try{grip.setPointerCapture(event.pointerId);}catch{}
    });
    document.addEventListener("pointermove",event=>{
      if(!photoResize)return;
      const delta=event.clientY-photoResize.startY;
      const size=Math.min(460,Math.max(160,photoResize.start+delta));
      if(size!==photoResize.current){photoResize.current=size;photoResize.banner.style.setProperty("--photo-size",`${size}px`);}
    });
    const endPhotoResize=()=>{
      if(!photoResize)return;
      const r=photoResize;photoResize=null;
      r.grip.classList.remove("dragging");
      try{if(r.grip.hasPointerCapture&&r.grip.hasPointerCapture())r.grip.releasePointerCapture();}catch{}
      if(r.current!==photoSizeValue()){db.settings.welcomePhotoSize=r.current;saveDB();toast(`Welcome banner height set to ${r.current}px.`);}
    };
    document.addEventListener("pointerup",endPhotoResize);
    document.addEventListener("pointercancel",endPhotoResize);
    $("#sidebarScrim").addEventListener("click",()=>{$("#sidebar").classList.remove("open");$("#sidebarScrim").classList.remove("show");});
    window.addEventListener("storage",event=>{if(event.key===STORE_KEY){db=readDB();render();}});
     try{if(localStorage.getItem(NAV_COLLAPSED_KEY)==="1")document.documentElement.classList.add("nav-collapsed");}catch{}
      setInterval(updateClock,1000);setInterval(()=>{if(page==="staffChat"&&currentUser)refreshStaffChat(true);},12000);setInterval(()=>{if(page!=="staffChat"||!currentUser)return;if(pruneExpiredChat()){render();return;}const timer=$("#chatExpiry");if(timer)timer.textContent=chatExpiryLabel();},60000);if(SERVER_MODE)initializeServerApp();else{if(runDataRepairs())saveDB();render();}
  })();
  </script>
</body>
</html>
